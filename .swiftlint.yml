# SwiftLint Configuration for TooCheapFi v1.5

# Paths to include/exclude
included:
  - Sources
  - Tests

excluded:
  - .build
  - Package.swift

# Enabled rules
opt_in_rules:
  # Code Style
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - vertical_parameter_alignment_on_call
  - unneeded_parentheses_in_closure_argument

  # Performance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - sorted_first_last

  # Safety
  - enum_case_associated_values_count
  - explicit_init
  - fatal_error_message
  - identical_operands
  - implicitly_unwrapped_optional  # NEW: Detect IUOs
  - overridden_super_call
  - unavailable_function
  - yoda_condition

  # Best Practices
  - joined_default_parameter
  - legacy_multiple
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool

  # API Design
  - discouraged_optional_boolean  # NEW: Avoid Bool? confusion
  - function_default_parameter_at_end  # NEW: Default params last

# Disabled rules
disabled_rules:
  - todo  # Allow TODO comments during development
  - trailing_comma  # Personal preference
  - opening_brace  # Conflicts with some formatting

# Rule configurations
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: false

file_length:
  warning: 400  # Tightened from 500
  error: 800    # Tightened from 1000
  ignore_comment_only_lines: true

type_body_length:
  warning: 200  # Tightened from 300
  error: 400    # Tightened from 500

function_body_length:
  warning: 35   # Tightened from 50
  error: 75     # Tightened from 100

function_parameter_count:
  warning: 5    # Tightened from 6
  error: 7      # Tightened from 8

cyclomatic_complexity:
  warning: 10   # Tightened from 15
  error: 20     # Tightened from 25

nesting:
  type_level: 2
  function_level: 3

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - i
    - j
    - k
    - x
    - y
    - z
    - id
    - ip
    - db
    - ok

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 60

large_tuple:
  warning: 3    # Tightened from 4
  error: 4      # Tightened from 5

# IUO configuration - strict enforcement
implicitly_unwrapped_optional:
  mode: all_except_iboutlets
  severity: error

# Custom rules
custom_rules:
  no_print_in_production:
    name: "No print statements"
    regex: "\\bprint\\s*\\("
    message: "Use Logger instead of print() for production code"
    severity: error  # Escalated from warning

  no_force_cast:
    name: "No force casting"
    regex: "\\bas!\\s"
    message: "Avoid force casting. Use 'as?' with proper handling instead."
    severity: warning

  no_hardcoded_credentials:
    name: "No hardcoded credentials"
    regex: "(password|secret|api_?key|token)\\s*[:=]\\s*[\"']"
    match_kinds:
      - string
    message: "Avoid hardcoding sensitive values"
    severity: error
